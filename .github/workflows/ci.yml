name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        # CI builds are never deployed, so the legal pages may still carry
        # placeholders here. A release build without this flag is refused by
        # scripts/check-legal.mjs until src/lib/legal-info.json is complete.
        env:
          ALLOW_INCOMPLETE_LEGAL: "1"

      - name: Guard - no secrets in the browser bundle
        run: |
          if grep -rIlE 'CHANNEL_SECRET|channelSecret|CHANNEL_ACCESS_TOKEN|-----BEGIN' dist/ ; then
            echo "::error::secret-looking string found in dist/"
            exit 1
          fi
          echo clean

      - run: npm audit --audit-level=high
