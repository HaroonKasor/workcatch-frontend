<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The product's own mark: a task row. Ink sheet, crimson state bar on the
       left, two rules standing in for a title and its meta line. Derived from
       the design system rather than borrowed from a framework. -->
  <rect width="32" height="32" rx="6" fill="#14181A"/>
  <rect x="7" y="8" width="3" height="16" fill="#96122F"/>
  <rect x="13" y="11" width="13" height="3" rx="1.5" fill="#FCFCFB"/>
  <rect x="13" y="18" width="8" height="3" rx="1.5" fill="#FCFCFB" opacity="0.45"/>
</svg>
